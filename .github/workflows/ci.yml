name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and tests
    # The installer step is Windows-only, and so are the paths its tests check.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn -B -ntp verify

  packaging:
    name: Packaging module (${{ matrix.os }})
    # tools/Packaging.psm1 runs in the programs' packaging scripts on all three systems, and on Windows
    # in Windows PowerShell 5.1 as well as in PowerShell 7.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Tests in PowerShell 7
        shell: pwsh
        run: ./tools/tests/Packaging.Tests.ps1

      - name: Tests in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/tests/Packaging.Tests.ps1
